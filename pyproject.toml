[project]
name = "shrew"
version = "0.1.0"
description = "Code Shrew"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=4.2,<5.0",
    "django-environ>=0.11,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "django-compressor>=4.4,<5.0",
    "django-compressor-toolkit>=0.6,<1.0",
    "commonmark>=0.9.1,<1.0",
    "django-markwhat>=1.6.2",
    "django-admin-sortable2>=2.2,<3.0",
    "micawber>=0.5.5",
    "beautifulsoup4>=4.12,<5.0",
    "django-allauth>=65.14.1,<65.15",
    "django-widget-tweaks>=1.5,<2.0",
    "django-bulma>=0.8.3",
    "django-simple-history>=3.4,<4.0",
    "django-autoslug>=1.9.9",
    "djangorestframework>=3.14,<4.0",
    "unidecode>=1.3,<2.0",
    "cloudconvert==2.1.0",
    "django-recaptcha>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.2,<5.0",
]

[tool.uv]
package = false
